[package]
name = "oidc4rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "OpenID Connect relying-party library built on jose4rs."
license = "BSD-2-Clause"
repository = "https://github.com/ogital-net/oidc4rs"
readme = "README.md"
keywords = ["oidc", "openid", "oauth", "authentication", "jose"]
categories = ["authentication", "web-programming", "api-bindings"]
include = [
    "src/**/*.rs",
    "examples/**/*.rs",
    "tests/**/*.rs",
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "AGENTS.md",
    "docs/**/*.md",
]

[dependencies]
# JOSE primitives. Pin to a major version; allow minor bumps.
# Backend selection (`aws-lc` or `boring`) is gated by oidc4rs's own
# `[features]` block below so we cannot accidentally enable both at
# the same time.
jose4rs = { version = "0.4", default-features = false }

# FFI bindings to the same backend jose4rs selected. Optional so the
# compile-time guard below can enforce exactly-one selection.
aws-lc-sys = { version = ">=0.40, <2", optional = true }
boring-sys = { version = "4", optional = true }

base64 = "0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"

# Optional hyper-based `AsyncHttpClient` implementation, gated behind
# the `hyper` feature (see [features] below and AGENTS.md's Async
# section for the tokio exception this pulls in transitively).
hyper = { version = "1", optional = true, features = ["http1"] }
hyper-util = { version = "0.1", optional = true, features = ["client", "client-legacy", "http1", "tokio"] }
hyper-rustls = { version = "0.27", optional = true, default-features = false, features = ["aws-lc-rs", "http1", "native-tokio", "rustls-native-certs", "tls12"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
http-body-util = { version = "0.1", optional = true }
bytes = { version = "1", optional = true }

[features]
default = ["aws-lc"]

# aws-lc backend. base64-simd + jwks-https-async are kept on the jose4rs
# dependency so callers get the same default experience jose4rs ships.
aws-lc = [
    "dep:aws-lc-sys",
    "jose4rs/aws-lc",
    "jose4rs/base64-simd",
    "jose4rs/jwks-https-async",
]

# boring backend. base64-simd is mandatory (jose4rs requires it when
# default features are disabled); jwks-https-async is kept on because
# our client depends on AsyncHttpsJwks.
boring = [
    "dep:boring-sys",
    "jose4rs/boring",
    "jose4rs/base64-simd",
    "jose4rs/jwks-https-async",
]

# `transport::hyper_client::HyperHttpClient`, a hyper + hyper-rustls
# `AsyncHttpClient` implementation. Requires a tokio runtime at call
# sites since hyper-util's connector is tokio-based; see AGENTS.md.
hyper = [
    "dep:hyper",
    "dep:hyper-util",
    "dep:hyper-rustls",
    "dep:rustls",
    "dep:http-body-util",
    "dep:bytes",
]

[dev-dependencies]
# Test-only async runtime. The crate itself is runtime-agnostic;
# tokio is the de-facto choice for in-crate async tests.
tokio = { version = "1", features = ["macros", "rt"] }
futures = "0.3"
jsonwebtoken = "9"
rsa = "0.9"
rand = "0.8"
hmac = "0.12"
sha2 = "0.10"
